name: Document Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation and license
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          test -s catalogo/catalogo.md
          test -s docs/comparativo-memoria.md
          test -s oportunidades/hindsight.md
          test -s oportunidades/supermemory.md
          test -s oportunidades/guac.md
          echo "Public documentation check passed"
