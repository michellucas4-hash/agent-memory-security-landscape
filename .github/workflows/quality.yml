name: Catalog Quality
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate public catalog (stdlib only)
        run: python3 -m unittest discover -s tests -v
      - name: Offline filter smoke test
        run: python3 scripts/filter_catalog.py --category memoria_ia --output json > /dev/null
